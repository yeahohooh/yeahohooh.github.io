<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <meta name="description" content="{{ .Description }}">
  <meta name="author" content="AptSub">
  <meta name="theme-color" content="#494f5c">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="AptSub">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ .Description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  {{ $style := resources.Get "scss/style.scss" | resources.ExecuteAsTemplate "css/style.css" . | toCSS | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" crossorigin="anonymous">
  <style>
    .aptsub-main { margin: 0 auto; padding-top: 20px; overflow-wrap: anywhere; }
    .aptsub-main h1 { margin: 0 0 20px; line-height: 1.35; }
    .aptsub-footer { padding: 24px 0 36px; border-top: 1px solid rgba(255,255,255,.12); font-size: .9rem; }
    .content a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="site-main section-inner thin aptsub-main">
    <h1>{{ .Title }}</h1>
    <div class="content">{{ .Content }}</div>
  </main>
  <footer class="section-inner thin aptsub-footer">
    AptSub · tc346492283@gmail.com
  </footer>
</body>
</html>
